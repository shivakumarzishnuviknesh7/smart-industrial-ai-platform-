apiVersion: apps/v1
kind: Deployment

metadata:
  name: smart-industrial-ai-platform
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: smart-industrial-ai-platform

  template:
    metadata:
      labels:
        app: smart-industrial-ai-platform

    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret

      containers:
        - name: smart-industrial-ai-platform

          image: registry.gitlab.com/zishnu-mlops/smart-industrial-ai-platform:bcee6052
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: smart-industrial-ai-config
                  key: MLFLOW_TRACKING_URI

          # -------------------------------------------------
          # Startup probe
          # Gives the application time to load the MLflow
          # champion model before health checks begin.
          # -------------------------------------------------

          startupProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36

          # Maximum startup allowance:
          # 36 x 5 seconds = 180 seconds

          # -------------------------------------------------
          # Readiness probe
          # Pod receives traffic only when the application
          # and model are ready.
          # -------------------------------------------------

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # -------------------------------------------------
          # Liveness probe
          # Restarts the container if the application
          # becomes unhealthy after startup.
          # -------------------------------------------------

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: smart-industrial-ai-platform
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  selector:
    matchLabels:
      app: smart-industrial-ai-platform

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /metrics/
      interval: 15s